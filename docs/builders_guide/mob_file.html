<h1><font color="#FF0000">The Mob File</font></h1>

<p>The mobs all live in a file called ###.mob, where ### is, of course,
the zone number.</p>

<p>At the bottom of the file, you will find:</p>

<blockquote>
  <blockquote>
    <blockquote>
      <blockquote>
        <p><font face="Lucida Console">#99999<br>
        $~</font></p>
      </blockquote>
    </blockquote>
  </blockquote>
</blockquote>

<p>which tells the mud code that there are no more mobs to read in this
file. </p>
