<p><strong><font color="#FF0080"><big><big>Shop File Format</big></big>
</font></strong></p>

<p>The shop file has the same basic format as all the other files.&nbsp;
It is a list of
shops followed by #99999 on a line by itself then $~ on a line by
itself.</p>

<p>&lt;shop #1&gt;<br>
&lt;shop #2&gt;<br>
<big><strong>&nbsp;&nbsp;&nbsp;&nbsp; .<br>
&nbsp;&nbsp;&nbsp;&nbsp; .<br>
&nbsp;&nbsp;&nbsp;&nbsp; .<br>
</strong></big>&lt;shop #n&gt;<br>
#99999<br>
$~</p>

<p>&nbsp;</p>
